<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>農作物 栽培日誌</title>
    <!-- Firebase SDK (v10 compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --bg-color: #e8f5e9;
            --primary-color: #2e7d32;
            --primary-hover: #1b5e20;
            --accent-color: #81c784;
            --card-bg: #ffffff;
            --text-color: #2c3e50;
        }

        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            background-color: var(--primary-color);
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        header h1 {
            margin: 0;
            font-size: 1.8rem;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            border-left: 6px solid var(--primary-color);
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: var(--primary-color);
        }

        input[type="text"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #c8e6c9;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
            background-color: #f1f8e9;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            background-color: #fff;
        }

        button.btn-submit {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }

        button.btn-submit:hover {
            background-color: var(--primary-hover);
        }

        .journal-item {
            position: relative;
        }

        .journal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e0e0e0;
            padding-bottom: 8px;
            margin-bottom: 10px;
        }

        .crop-badge {
            background-color: var(--accent-color);
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .journal-date {
            color: #666;
            font-size: 0.9rem;
        }

        .journal-category {
            display: inline-block;
            background-color: #c8e6c9;
            color: var(--primary-color);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .journal-content {
            white-space: pre-wrap;
            line-height: 1.5;
        }

        .btn-delete {
            background-color: #e57373;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            margin-top: 10px;
        }

        .btn-delete:hover {
            background-color: #d32f2f;
        }

        .empty-message {
            text-align: center;
            color: #666;
            padding: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🌱 農作物 栽培日誌</h1>
    </header>

    <!-- 日誌入力フォーム -->
    <div class="card">
        <h2>新しい日誌を記録</h2>
        <form id="journal-form">
            <div class="form-group">
                <label for="date">日付</label>
                <input type="date" id="date" required>
            </div>
            <div class="form-group">
                <label for="crop">作物名</label>
                <input type="text" id="crop" placeholder="例: ミニトマト、ナス、イチゴ" required>
            </div>
            <div class="form-group">
                <label for="category">作業内容</label>
                <select id="category">
                    <option value="水やり">水やり</option>
                    <option value="施肥（肥料）">施肥（肥料）</option>
                    <option value="追肥・間引き">追肥・間引き</option>
                    <option value="病害虫対策">病害虫対策</option>
                    <option value="収穫">収穫</option>
                    <option value="その他">その他（観察など）</option>
                </select>
            </div>
            <div class="form-group">
                <label for="notes">詳細メモ・成長記録</label>
                <textarea id="notes" rows="4" placeholder="成長具合や気づいたことを入力..." required></textarea>
            </div>
            <button type="submit" class="btn-submit">日誌を保存する</button>
        </form>
    </div>

    <!-- 記録一覧 -->
    <h2>栽培記録一覧</h2>
    <div id="journal-list"></div>
</div>

<script>
    // Firebase設定
    const firebaseConfig = {
        apiKey: "AIzaSyAoY1uvCLn6DpjIrYMm-l5qZ4spRNVlDxQ",
        authDomain: "task1-9c89b.firebaseapp.com",
        projectId: "task1-9c89b",
        storageBucket: "task1-9c89b.firebasestorage.app",
        messagingSenderId: "920132069499",
        appId: "1:920132069499:web:09cad0185af88a4e2adade"
    };

    // Firebase 初期化
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // 今日の日付を初期値として設定
    document.getElementById('date').valueAsDate = new Date();

    const journalForm = document.getElementById('journal-form');
    const journalList = document.getElementById('journal-list');

    // 日誌の保存処理
    journalForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        const date = document.getElementById('date').value;
        const crop = document.getElementById('crop').value;
        const category = document.getElementById('category').value;
        const notes = document.getElementById('notes').value;

        try {
            await db.collection('crop_journals').add({
                date: date,
                crop: crop,
                category: category,
                notes: notes,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });

            // フォームリセット（日付は維持）
            document.getElementById('crop').value = '';
            document.getElementById('notes').value = '';
            alert('日誌を記録しました！');
        } catch (error) {
            console.error("データの保存エラー: ", error);
            alert('保存に失敗しました。Firestoreのパーミッション設定を確認してください。');
        }
    });

    // データのリアルタイム取得・表示
    db.collection('crop_journals')
        .orderBy('date', 'desc')
        .onSnapshot((snapshot) => {
            journalList.innerHTML = '';

            if (snapshot.empty) {
                journalList.innerHTML = '<div class="card empty-message">まだ記録がありません。</div>';
                return;
            }

            snapshot.forEach((doc) => {
                const data = doc.data();
                const card = document.createElement('div');
                card.className = 'card journal-item';

                card.innerHTML = `
                    <div class="journal-header">
                        <span class="crop-badge">${escapeHtml(data.crop)}</span>
                        <span class="journal-date">${escapeHtml(data.date)}</span>
                    </div>
                    <span class="journal-category">${escapeHtml(data.category)}</span>
                    <div class="journal-content">${escapeHtml(data.notes)}</div>
                    <button class="btn-delete" onclick="deleteJournal('${doc.id}')">削除</button>
                `;

                journalList.appendChild(card);
            });
        });

    // 日誌の削除処理
    async function deleteJournal(id) {
        if (confirm('この記録を削除してもよろしいですか？')) {
            try {
                await db.collection('crop_journals').doc(id).delete();
            } catch (error) {
                console.error("削除エラー: ", error);
                alert('削除に失敗しました。');
            }
        }
    }

    // XSS対策のエスケープ関数
    function escapeHtml(str) {
        if (!str) return '';
        return str
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }
</script>

</body>
</html>
